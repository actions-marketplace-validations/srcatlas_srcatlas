name: Bug
description: Something in the CLI, viewer, Action or docs does not work as documented
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: srcatlas version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Config, Viewer, Renderer / export, GitHub Action, Docs]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and operating system
      placeholder: "Node 22.11, Windows 11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
