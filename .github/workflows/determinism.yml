name: determinism

# Same commit, same bytes, on every operating system (CLAUDE.md non-negotiable 2, docs/accuracy.md
# section 5). The same real repository, at a pinned commit, is analysed on three systems from
# three different checkout paths; the graph files must be byte-identical.
# The target is fetched from GitHub only to be read; the analyser itself makes no network calls.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/determinism.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

env:
  # crwsync apps/backend: the target of the M1 exit check (bench/m1-exit/RULES.md).
  TARGET_REPOSITORY: JustTunya/crwsync
  TARGET_SHA: 030ebf2e8f3288c019ebd1c5c827ebf026778304

jobs:
  analyze:
    name: analyze / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: target
      - name: Analyse the target
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node packages/cli/dist/bin.js analyze target \
            --out "$RUNNER_TEMP/out/srcatlas.graph.json" \
            --report "$RUNNER_TEMP/out/srcatlas.report.json"
          sha256sum "$RUNNER_TEMP/out/srcatlas.graph.json" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/out/srcatlas.graph.json"
      - uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.os }}
          path: ${{ runner.temp }}/out/srcatlas.graph.json
          if-no-files-found: error

  compare:
    name: byte-identical across systems
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          path: graphs
      - name: Compare
        run: |
          ls -R graphs
          sha256sum graphs/*/srcatlas.graph.json
          test "$(ls graphs | wc -l)" -eq 3
          test "$(sha256sum graphs/*/srcatlas.graph.json | cut -d' ' -f1 | sort -u | wc -l)" -eq 1 || {
            echo "::error::graph files differ between operating systems"
            first=$(ls graphs | head -1)
            for d in graphs/*; do
              diff <(cat "graphs/$first/srcatlas.graph.json") "$d/srcatlas.graph.json" | head -40 || true
            done
            exit 1
          }
