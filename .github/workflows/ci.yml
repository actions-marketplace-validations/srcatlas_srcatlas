name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:deps
      # The published package must install and run on its own: the workspace
      # packages are bundled into it, so a missing bundle shows up only here.
      - name: Packed CLI runs from a clean directory
        if: runner.os == 'Linux'
        run: |
          pnpm --filter srcatlas pack --pack-destination "$RUNNER_TEMP/pack"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/srcatlas-*.tgz
          npx srcatlas --version
